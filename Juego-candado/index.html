<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal de Acceso</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

    :root {
      --green: #4dff87;
      --green-bright: #a9ffbf;
      --green-dim: #1d8f49;
      --ink: #020502;
      --cream: #e8e5d8;
      --red: #ff4d4d;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--cream);
      font-family: "Share Tech Mono", monospace;
      background: #001207;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .43;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(0, 10, 3, .62) 100%);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .terminal {
      width: min(94vw, 510px);
      padding: 0;
    }

    .terminal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 28px;
      padding: 0 2px 10px;
      color: #8d9685;
      font-size: .62rem;
      letter-spacing: .13em;
    }

    .screen {
      position: relative;
      overflow: hidden;
      min-height: 580px;
      padding: 28px 22px 22px;
      background: rgba(2, 10, 4, .82);
    }

    .screen::before {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: .18;
      background: repeating-linear-gradient(0deg, transparent 0 2px, #73ff98 3px 4px);
      mix-blend-mode: screen;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--green);
      font-size: .7rem;
      letter-spacing: .08em;
    }

    .signal { animation: blink 1.1s steps(2) infinite; }

    .lock-visual {
      display: block;
      width: 62px;
      height: 53px;
      position: relative;
      border: 4px solid var(--green);
      border-radius: 6px;
      box-shadow: 0 0 16px rgba(77, 255, 135, .8), inset 0 0 18px rgba(77, 255, 135, .2);
    }

    .lock-visual::before {
      position: absolute;
      left: 12px;
      bottom: 50px;
      width: 30px;
      height: 31px;
      content: "";
      border: 4px solid var(--green);
      border-bottom: 0;
      border-radius: 27px 27px 0 0;
      box-shadow: 0 -3px 14px rgba(77, 255, 135, .55);
    }

    .lock-visual::after {
      position: absolute;
      top: 16px;
      left: 23px;
      width: 9px;
      height: 16px;
      content: "";
      border-radius: 8px;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .lock-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 28px auto 18px;
    }

    .lock-launch {
      width: 72px;
      height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .lock-launch:hover .lock-visual, .lock-launch:focus-visible .lock-visual {
      border-color: var(--green-bright);
      box-shadow: 0 0 24px rgba(77, 255, 135, 1), inset 0 0 18px rgba(77, 255, 135, .3);
    }

    .lock-launch:focus-visible { outline: 1px solid var(--green-bright); outline-offset: 4px; }
    .lock-launch:disabled { cursor: default; opacity: .55; }

    h1, p { margin: 0; }
    h1 {
      color: var(--green-bright);
      text-align: center;
      font: 2.25rem/1 "VT323", monospace;
      letter-spacing: .08em;
      text-shadow: 0 0 12px var(--green);
    }

    .instruction {
      min-height: 42px;
      margin: 14px auto 23px;
      color: #89d99d;
      text-align: center;
      font-size: .8rem;
      line-height: 1.5;
    }

    .permanent-clue {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      margin: -8px 0 19px;
      color: #589b68;
      font-size: .66rem;
      letter-spacing: .12em;
    }

    .permanent-clue strong {
      color: var(--green-bright);
      font: 1.5rem "VT323", monospace;
      letter-spacing: .16em;
      text-shadow: 0 0 8px rgba(77, 255, 135, .7);
    }

    .mission-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin: 0 0 13px;
    }

    .mission {
      height: 37px;
      padding: 0;
      border: 1px solid #1d6c38;
      border-radius: 0;
      color: #63bd78;
      font: 1.35rem "VT323", monospace;
      background: #061508;
      cursor: pointer;
    }

    .mission:hover, .mission:focus-visible, .mission.active {
      border-color: var(--green-bright);
      color: #001b09;
      background: var(--green);
      box-shadow: 0 0 10px rgba(77, 255, 135, .55);
      outline: none;
    }

    .mission:disabled, .key:disabled {
      border-color: #1a3320;
      color: #386141;
      background: #061009;
      box-shadow: none;
      cursor: not-allowed;
      opacity: .65;
    }

    .timer {
      padding: 4px 7px;
      border: 1px solid #347645;
      border-radius: 0;
      color: var(--green);
      font: .72rem "Share Tech Mono", monospace;
      letter-spacing: .08em;
      background: rgba(3, 20, 8, .8);
    }

    .timer.active { border-color: var(--green-bright); color: var(--green-bright); }

    .lemon-trigger {
      position: absolute;
      z-index: 4;
      right: 14px;
      bottom: 14px;
      width: 31px;
      height: 31px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      font-size: 1.05rem;
      background: transparent;
      cursor: pointer;
      filter: saturate(.75);
      transition: filter .2s, transform .2s, border-color .2s;
    }

    .lemon-trigger:hover, .lemon-trigger:focus-visible, .lemon-trigger.active {
      border-color: #d8ff51;
      filter: saturate(1.2) drop-shadow(0 0 5px #d8ff51);
      transform: rotate(-12deg) scale(1.12);
      outline: none;
    }

    .digits {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .digit {
      width: 100%;
      aspect-ratio: 1 / 1.25;
      padding: 0;
      border: 1px solid #237541;
      border-radius: 3px;
      color: var(--green);
      font: 3.1rem/1 "VT323", monospace;
      text-align: center;
      background: #000;
      box-shadow: inset 0 0 17px rgba(0, 255, 75, .12), 0 0 8px rgba(0, 255, 75, .15);
      caret-color: transparent;
      outline: 0;
      transition: border-color .2s, box-shadow .2s, color .2s;
    }

    .digit:focus { border-color: var(--green-bright); box-shadow: 0 0 14px rgba(77, 255, 135, .55), inset 0 0 17px rgba(0, 255, 75, .16); }
    .digit.locked { border-color: var(--green-bright); color: #001b09; background: var(--green); box-shadow: 0 0 16px rgba(77, 255, 135, .85); }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .key {
      height: 48px;
      border: 1px solid #19592f;
      border-radius: 3px;
      color: #b3ffc4;
      font: 1.65rem "VT323", monospace;
      background: rgba(8, 34, 15, .84);
      cursor: pointer;
      transition: transform .1s, background .15s, box-shadow .15s;
    }

    .key:hover, .key:focus-visible { background: #174b25; box-shadow: 0 0 10px rgba(77, 255, 135, .4); outline: none; }
    .key:active { transform: translateY(2px); background: #206b35; }
    .key.enter { color: #001b09; font-size: 1.05rem; background: var(--green); }
    .key.enter:hover { background: var(--green-bright); }
    .key.enter:disabled { color: #386141; background: #061009; }
    .key.delete { color: #89d99d; font-size: 1.25rem; }

    .footer-status {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
      color: #499b5d;
      font-size: .64rem;
      letter-spacing: .12em;
    }

    .modal {
      position: absolute;
      z-index: 6;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(0, 15, 5, .93);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-panel { max-width: 300px; }
    .modal-title { color: var(--green-bright); font: 3rem "VT323", monospace; text-shadow: 0 0 14px var(--green); }
    .modal-copy { margin: 12px 0 24px; color: #b4e9bf; font-size: .85rem; line-height: 1.6; }
    .retry { padding: 11px 18px; border: 1px solid var(--green); border-radius: 3px; color: var(--green); font: .9rem "Share Tech Mono", monospace; background: transparent; cursor: pointer; }
    .retry:hover { color: #001b09; background: var(--green); }
    .error .modal-title { color: var(--red); text-shadow: 0 0 14px var(--red); }
    .error .retry { border-color: var(--red); color: var(--red); }
    .error .retry:hover { color: #260000; background: var(--red); }

    .success .lock-visual { animation: unlock .8s ease-in forwards; }
    .shake { animation: shake .36s linear; }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @keyframes unlock { 55% { transform: translateY(7px); } 100% { transform: translateY(13px); opacity: .35; } }

    @media (max-height: 690px) {
      .screen { min-height: 0; padding-top: 18px; }
      .lock-control { margin: 15px auto; transform: scale(.82); }
      .instruction { margin: 6px auto 13px; }
      .digit { font-size: 2.7rem; }
      .key { height: 40px; }
      .footer-status { margin-top: 12px; }
    }

    @media (max-width: 390px) {
      .screen { padding: 20px 14px 16px; }
      .lock-control { transform: scale(.85); }
    }

    @media (max-height: 500px) {
      .stage { place-items: start center; padding: 5px 10px; }
      .terminal-top { min-height: 18px; padding-bottom: 3px; font-size: .5rem; }
      .screen { min-height: 0; padding: 7px 12px 8px; }
      .mission-selector { margin-bottom: 5px; }
      .mission { height: 27px; font-size: 1.05rem; }
      .status { font-size: .54rem; }
      .lock-control { gap: 8px; margin: 2px auto 1px; transform: none; }
      .lock-launch { width: 48px; height: 51px; }
      .lock-visual { transform: scale(.66); transform-origin: center bottom; }
      .timer { padding: 3px 5px; font-size: .58rem; }
      h1 { font-size: 1.7rem; }
      .instruction { min-height: 0; margin: 3px auto 4px; font-size: .64rem; line-height: 1.35; }
      .permanent-clue { gap: 7px; margin: 0 0 5px; font-size: .52rem; }
      .permanent-clue strong { font-size: 1.15rem; }
      .digits { gap: 6px; margin-bottom: 7px; }
      .digit { height: clamp(46px, 12vw, 62px); aspect-ratio: auto; font-size: 2.15rem; }
      .keypad { gap: 5px; }
      .key { height: 28px; font-size: 1.25rem; }
      .key.enter { font-size: .76rem; }
      .key.delete { font-size: .9rem; }
      .footer-status { display: none; }
      .lemon-trigger { right: 6px; bottom: 4px; width: 24px; height: 24px; font-size: .8rem; }
    }

    @media (max-height: 360px) {
      .stage { padding: 2px 8px; }
      .terminal-top { display: none; }
      .screen { padding: 4px 10px 5px; }
      .mission-selector { gap: 3px; margin-bottom: 2px; }
      .mission { height: 20px; font-size: .82rem; }
      .status { font-size: .45rem; }
      .lock-control { margin: 0 auto; gap: 4px; }
      .lock-launch { width: 39px; height: 38px; }
      .lock-visual { transform: scale(.45); transform-origin: center bottom; }
      .timer { padding: 2px 4px; font-size: .46rem; }
      h1 { font-size: 1.3rem; }
      .instruction { display: none; }
      .permanent-clue { margin: 0 0 2px; font-size: .42rem; }
      .permanent-clue strong { font-size: .85rem; }
      .digits { gap: 4px; margin-bottom: 4px; }
      .digit { height: 35px; font-size: 1.55rem; }
      .keypad { gap: 3px; }
      .key { height: 20px; font-size: 1rem; }
      .key.enter { font-size: .57rem; }
      .key.delete { font-size: .67rem; }
      .lemon-trigger { top: 36px; right: 1px; bottom: auto; width: 16px; height: 16px; font-size: .5rem; }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <main class="stage">
    <section class="terminal" aria-label="Terminal de desbloqueo">
      <div class="terminal-top"><span>ROBCO INDUSTRIES (TM)</span><span>TERMINAL 04</span></div>
      <div class="screen" id="screen">
        <div class="mission-selector" aria-label="Seleccionar misión">
          <button class="mission active" data-mission="1">01</button><button class="mission" data-mission="2">02</button><button class="mission" data-mission="3">03</button><button class="mission" data-mission="4">04</button><button class="mission" data-mission="5">05</button><button class="mission" data-mission="6">06</button>
        </div>
        <div class="status"><span class="signal">&#9646;&#9646;&#9646; RED SEGURA</span><span id="clock">--:--:--</span></div>
        <div class="lock-control">
          <button class="lock-launch" id="lockLaunch" type="button" aria-label="Iniciar sesión de 60 segundos" title="Iniciar sesión de 60 segundos"><span class="lock-visual" aria-hidden="true"></span></button>
          <span class="timer" id="timer">TOCA EL CANDADO · 60s</span>
        </div>
        <h1>ACCESO RESTRINGIDO</h1>
        <p class="instruction" id="instruction">Selecciona una misión y toca el candado<br>para habilitar la terminal durante 60 segundos.</p>
        <div class="permanent-clue" aria-label="Pista permanente: números 9 y 3"><span>DATOS RECUPERADOS</span><strong>9 · 3</strong></div>
        <div class="digits" aria-label="Código de cuatro dígitos">
          <input class="digit" inputmode="numeric" maxlength="1" aria-label="Primer dígito" readonly />
          <input class="digit" inputmode="numeric" maxlength="1" aria-label="Segundo dígito" readonly />
          <input class="digit" inputmode="numeric" maxlength="1" aria-label="Tercer dígito" readonly />
          <input class="digit" inputmode="numeric" maxlength="1" aria-label="Cuarto dígito" readonly />
        </div>
        <div class="keypad" aria-label="Teclado numérico">
          <button class="key" data-key="1" disabled>1</button><button class="key" data-key="2" disabled>2</button><button class="key" data-key="3" disabled>3</button>
          <button class="key" data-key="4" disabled>4</button><button class="key" data-key="5" disabled>5</button><button class="key" data-key="6" disabled>6</button>
          <button class="key" data-key="7" disabled>7</button><button class="key" data-key="8" disabled>8</button><button class="key" data-key="9" disabled>9</button>
          <button class="key delete" data-key="delete" aria-label="Borrar último dígito" disabled>DEL</button><button class="key" data-key="0" disabled>0</button><button class="key enter" data-key="enter" disabled>ABRIR</button>
        </div>
        <div class="footer-status"><span>&#9679;</span><span>SISTEMA EN ESPERA</span></div>
        <button class="lemon-trigger" id="lemonTrigger" type="button" aria-label="Habilitar prueba especial" title="Prueba especial">&#127819;</button>
        <div class="modal" id="modal" role="dialog" aria-modal="true" aria-live="assertive">
          <div class="modal-panel">
            <p class="modal-title" id="modalTitle"></p>
            <p class="modal-copy" id="modalCopy"></p>
            <button class="retry" id="retry"></button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const missionCodes = {
      1: '1932',
      2: '3094',
      3: '7392',
      4: '9431',
      5: '3957',
      6: '6983'
    }; // Cada clave usa las pistas fijas 9 y 3, más dos cifras obtenidas en los retos.
    const digits = [...document.querySelectorAll('.digit')];
    const screen = document.querySelector('#screen');
    const instruction = document.querySelector('#instruction');
    const modal = document.querySelector('#modal');
    const modalTitle = document.querySelector('#modalTitle');
    const modalCopy = document.querySelector('#modalCopy');
    const retry = document.querySelector('#retry');
    const missions = [...document.querySelectorAll('.mission')];
    const controls = [...document.querySelectorAll('.key')];
    const timer = document.querySelector('#timer');
    const lockLaunch = document.querySelector('#lockLaunch');
    const clock = document.querySelector('#clock');
    const lemonTrigger = document.querySelector('#lemonTrigger');
    let activeMission = '1';
    let specialChallenge = false;
    let entry = Array(4).fill('');
    let locked = Array(4).fill(false);
    let sessionActive = false;
    let countdownId;

    function renderEntry() {
      digits.forEach((digit, index) => {
        digit.value = entry[index];
        digit.classList.toggle('locked', locked[index]);
      });
    }

    function addDigit(value) {
      const nextIndex = entry.findIndex((digit, index) => !locked[index] && !digit);
      if (nextIndex !== -1) entry[nextIndex] = value;
      renderEntry();
    }

    function reset() {
      entry = Array(4).fill('');
      locked = Array(4).fill(false);
      renderEntry();
      modal.className = 'modal';
      screen.classList.remove('success', 'shake');
      instruction.innerHTML = 'Ingresa los cuatro dígitos recuperados<br>para liberar el premio.';
    }

    function validate() {
      if (entry.some((digit) => !digit)) {
        instruction.textContent = 'Faltan dígitos. Completa la secuencia.';
        return;
      }
      const accessCode = specialChallenge ? '9324' : missionCodes[activeMission];
      if (entry.join('') === accessCode) {
        screen.classList.add('success');
        modalTitle.textContent = specialChallenge ? 'PRUEBA ESPECIAL' : 'CAJA ABIERTA';
        modalCopy.textContent = specialChallenge
          ? 'Este es especial para vos hermosaa, te quiero Limoncito trucho \u2665'
          : 'Código confirmado. El premio es suyo.';
        retry.textContent = 'NUEVO JUEGO';
        modal.className = 'modal show';
      } else {
        entry.forEach((digit, index) => {
          if (digit === accessCode[index]) locked[index] = true;
          else if (!locked[index]) entry[index] = '';
        });
        renderEntry();
        screen.classList.add('shake');
        const lockedCount = locked.filter(Boolean).length;
        instruction.textContent = lockedCount
          ? `${lockedCount} posición${lockedCount === 1 ? '' : 'es'} confirmada${lockedCount === 1 ? '' : 's'}. Completa las casillas restantes.`
          : 'Ninguna posición coincide. Revisa las pistas e inténtalo de nuevo.';
        setTimeout(() => screen.classList.remove('shake'), 400);
      }
    }

    function setControlsEnabled(enabled) {
      sessionActive = enabled;
      controls.forEach((control) => { control.disabled = !enabled; });
    }

    function startTimer() {
      clearInterval(countdownId);
      let remaining = 60;
      setControlsEnabled(true);
      reset();
      timer.classList.add('active');
      lockLaunch.disabled = true;
      instruction.innerHTML = 'Terminal habilitada. Selecciona una misión e ingresa<br>los cuatro dígitos antes de que termine el tiempo.';
      const updateTimer = () => {
        timer.textContent = `TIEMPO ${String(remaining).padStart(2, '0')}s`;
        if (remaining === 0) {
          clearInterval(countdownId);
          setControlsEnabled(false);
          timer.classList.remove('active');
          lockLaunch.disabled = false;
          timer.textContent = 'TOCA EL CANDADO · 60s';
          instruction.textContent = 'Tiempo agotado. Toca el candado para una nueva sesión.';
          return;
        }
        remaining -= 1;
      };
      updateTimer();
      countdownId = setInterval(updateTimer, 1000);
    }

    function updateClock() {
      clock.textContent = new Intl.DateTimeFormat('es-ES', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(new Date());
    }

    document.querySelectorAll('[data-key]').forEach((button) => {
      button.addEventListener('click', () => {
        const { key } = button.dataset;
        if (/^\d$/.test(key)) addDigit(key);
        if (key === 'delete') {
          const lastIndex = [...entry.keys()].reverse().find((index) => !locked[index] && entry[index]);
          if (lastIndex !== undefined) entry[lastIndex] = '';
          renderEntry();
        }
        if (key === 'enter') validate();
      });
    });

    missions.forEach((mission) => {
      mission.addEventListener('click', () => {
        activeMission = mission.dataset.mission;
        specialChallenge = false;
        lemonTrigger.classList.remove('active');
        missions.forEach((button) => button.classList.toggle('active', button === mission));
        reset();
        instruction.innerHTML = `Misión ${activeMission} seleccionada. Ingresa los cuatro dígitos<br>para liberar el premio.`;
      });
    });

    lemonTrigger.addEventListener('click', () => {
      specialChallenge = true;
      lemonTrigger.classList.add('active');
      missions.forEach((button) => button.classList.remove('active'));
      reset();
      instruction.innerHTML = 'Prueba especial habilitada. Toca el candado e ingresa<br>el código secreto de cuatro dígitos.';
    });

    document.addEventListener('keydown', (event) => {
      if (!sessionActive || modal.classList.contains('show')) return;
      if (/^\d$/.test(event.key)) addDigit(event.key);
      if (event.key === 'Backspace') {
        const lastIndex = [...entry.keys()].reverse().find((index) => !locked[index] && entry[index]);
        if (lastIndex !== undefined) entry[lastIndex] = '';
        renderEntry();
      }
      if (event.key === 'Enter') validate();
    });
    retry.addEventListener('click', reset);
    lockLaunch.addEventListener('click', startTimer);
    updateClock();
    setInterval(updateClock, 1000);

    const canvas = document.querySelector('#matrix');
    const context = canvas.getContext('2d');
    const alphabet = '0123456789ABCDEF';
    let columns;
    let drops;

    function resizeMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / 17);
      drops = Array(columns).fill(1);
    }

    function drawMatrix() {
      context.fillStyle = 'rgba(0, 18, 7, .12)';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#38d86a';
      context.font = '15px Share Tech Mono, monospace';
      drops.forEach((drop, index) => {
        const character = alphabet[Math.floor(Math.random() * alphabet.length)];
        context.fillText(character, index * 17, drop * 17);
        if (drop * 17 > canvas.height && Math.random() > .974) drops[index] = 0;
        drops[index] += 1;
      });
      requestAnimationFrame(drawMatrix);
    }

    resizeMatrix();
    window.addEventListener('resize', resizeMatrix);
    drawMatrix();
  </script>
</body>
